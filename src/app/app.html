<!-- Fondo Minimalista: Red Neuronal Tenue & Nodos Flotantes -->
<app-neural-nodes-background />

<!-- Header -->
<app-header />

<!-- Contenedor Principal (Centrado vertical y horizontalmente en pantalla) -->
<main class="w-full max-w-7xl mx-auto my-auto grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center z-10 py-4 sm:py-6 lg:py-0">
  <!-- Columna Izquierda: Información + Menú Interactivo -->
  <section class="lg:col-span-6 flex flex-col justify-center space-y-6 sm:space-y-8">
    <div class="space-y-3 sm:space-y-4">
      <p class="font-mono text-xs uppercase tracking-widest text-mono-muted">
        // Software Developer • Angular &amp; AI Automation
      </p>
      <h1 class="text-4xl sm:text-6xl lg:text-7xl font-bold tracking-tighter text-neutral-950 dark:text-white leading-[0.95]">
        Daniel Vásquez
      </h1>
      <p class="text-sm sm:text-base lg:text-lg text-neutral-600 dark:text-neutral-300 max-w-xl font-normal leading-relaxed">
        Desarrollo aplicaciones web reactivas en Angular, integraciones de APIs y flujos autónomos con n8n e IA. Combino ingeniería de software con soluciones en WordPress y analítica estratégica en Google Analytics 4.
      </p>

      <!-- Competencias Clave (LinkedIn / Tech Stack) -->
      <app-tech-badges />
    </div>

    <!-- Menú Interactivo Principal -->
    <app-navigation-menu
      [items]="menuItems"
      [activePreviewId]="activePreviewId()"
      (hoverPreview)="onHoverPreview($event)"
      (selectModal)="onOpenModal($event)"
    />
  </section>

  <!-- Columna Derecha: Visor de Animación Interactivo -->
  <section aria-label="Vista previa interactiva" class="lg:col-span-6 flex items-center justify-center w-full self-center">
    <app-preview-card [preview]="currentPreview()" class="w-full flex items-center justify-center" />
  </section>
</main>

<!-- Footer -->
<app-footer />

<!-- Modales Minimalistas -->
<app-projects-modal
  [isOpen]="activeModal() === 'projects'"
  [projects]="projectsData"
  (closed)="onCloseModal()"
/>

<app-stack-modal
  [isOpen]="activeModal() === 'stack'"
  [categories]="stackCategories"
  (closed)="onCloseModal()"
/>

<app-about-modal
  [isOpen]="activeModal() === 'about'"
  (closed)="onCloseModal()"
/>

<app-contact-modal
  [isOpen]="activeModal() === 'contact'"
  (closed)="onCloseModal()"
/>
